# Install as /etc/nginx/sites-available/wine.clearnuvo.com and symlink into
# sites-enabled. Needs conf.d/wine-tracker-http.conf, snippets/wine-proxy.conf
# and the two generated Cloudflare snippets (ops/cf-ips.sh).
#
# TLS: Cloudflare Origin CA certificate, edge SSL mode Full (strict) via a
# Configuration Rule on wine.clearnuvo.com. The DNS record must stay
# proxied (orange cloud): the origin cert is only trusted by Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name wine.clearnuvo.com;

    if ($wine_from_cf = 0) { return 403; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wine.clearnuvo.com;

    ssl_certificate     /etc/ssl/cloudflare/wine.clearnuvo.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/wine.clearnuvo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Real visitor IP, trusted only from Cloudflare ranges.
    include /etc/nginx/snippets/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Only Cloudflare may talk to this vhost. $wine_from_cf is computed from
    # $realip_remote_addr (the TCP peer), not the rewritten visitor IP.
    if ($wine_from_cf = 0) { return 403; }

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Container-internal probe only.
    location = /healthz { return 404; }

    location = /login {
        limit_req zone=wine_login burst=5 nodelay;
        include /etc/nginx/snippets/wine-proxy.conf;
    }

    location /api/ {
        limit_req zone=wine_api burst=60 nodelay;
        include /etc/nginx/snippets/wine-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/wine-proxy.conf;
    }

    access_log /var/log/nginx/wine.access.log;
    error_log  /var/log/nginx/wine.error.log;
}
