# Install as /etc/nginx/snippets/wine-proxy.conf
proxy_pass http://127.0.0.1:8096;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Visitor IP after realip. Overwrites anything the client sent.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
# Never pass the Home Assistant ingress prefix header through.
proxy_set_header X-Ingress-Path "";
# Cloudflare Access identity, validated by the app.
proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
# Label recognition and web lookup calls can take a while.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
