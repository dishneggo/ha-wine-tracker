# http-level pieces for wine.clearnuvo.com.
# Install as /etc/nginx/conf.d/wine-tracker-http.conf
# (Ubuntu's nginx.conf includes /etc/nginx/conf.d/*.conf inside http {}).

# 1 when the TCP peer (before realip rewriting) is a Cloudflare address.
# The list is generated by ops/cf-ips.sh.
geo $realip_remote_addr $wine_from_cf {
    default 0;
    include /etc/nginx/snippets/cloudflare-geo.conf;
}

# Rate limits keyed on the real visitor IP (CF-Connecting-IP via realip).
limit_req_zone $binary_remote_addr zone=wine_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=wine_api:10m rate=120r/m;
limit_req_status 429;
